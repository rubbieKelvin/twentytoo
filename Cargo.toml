[workspace]
members = ["crates/twentytoo-core", "crates/twentytoo", "crates/twentytoo-db"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/rubbieKelvin/twentytoo"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
async-trait = "0.1.92"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
futures = "0.3"
parking_lot = "0.12"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "chrono", "uuid", "json"] }

[workspace.lints.clippy]
# Explicit `return` statements are required; the idiomatic tail-expression form
# is rejected. `needless_return` is the inverse lint and is disabled so explicit
# tail returns don't warn.
implicit_return = "deny"
needless_return = "allow"
