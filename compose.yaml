services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: twentytoo
      POSTGRES_PASSWORD: twentytoo
      POSTGRES_DB: twentytoo
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twentytoo -d twentytoo"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://twentytoo:twentytoo@db:5432/twentytoo
    depends_on:
      db:
        condition: service_healthy

  pgweb:
    image: sosedoff/pgweb
    ports: ["8081:8081"]
    environment:
      DATABASE_URL: postgres://twentytoo:twentytoo@db:5432/twentytoo?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
